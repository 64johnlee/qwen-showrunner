<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e8b04b"/>
    </marker>
    <style>
      .bg{fill:#0b0b0f}
      .box{fill:#191921;stroke:#2b2b38;stroke-width:1.5}
      .model{fill:#14141b;stroke:#7a5f27;stroke-width:1.5}
      .lbl{fill:#f4f1ea;font-size:15px;font-weight:600}
      .sub{fill:#8a8a99;font-size:12px}
      .gold{fill:#e8b04b;font-size:13px;font-weight:700}
      .flow{stroke:#e8b04b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .title{fill:#f4f1ea;font-size:22px;font-weight:700}
      .cap{fill:#8a8a99;font-size:12px}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <text class="title" x="34" y="46">Qwen Showrunner — Architecture</text>
  <text class="cap" x="34" y="68">Autonomous 微短剧 pipeline · all models on Qwen Cloud free tier (dashscope-intl)</text>

  <rect class="box" x="34" y="110" width="150" height="70" rx="12"/>
  <text class="lbl" x="52" y="140">Premise</text>
  <text class="sub" x="52" y="160">one line of text</text>

  <rect class="model" x="230" y="105" width="180" height="80" rx="12"/>
  <text class="gold" x="248" y="132">Qwen-Max</text>
  <text class="lbl" x="248" y="154">Scriptwriter</text>
  <text class="sub" x="248" y="173">screenplay JSON</text>

  <line class="flow" x1="184" y1="145" x2="228" y2="145"/>

  <rect x="470" y="70" width="230" height="220" rx="14" fill="#101017" stroke="#2b2b38" stroke-width="1.5"/>
  <text class="cap" x="486" y="92">for each shot</text>

  <rect class="model" x="490" y="104" width="190" height="52" rx="10"/>
  <text class="gold" x="506" y="126">Wan  (t2v)</text>
  <text class="sub" x="506" y="145">wan2.2-t2v-plus → shot video</text>

  <rect class="model" x="490" y="164" width="190" height="52" rx="10"/>
  <text class="gold" x="506" y="186">Qwen3-TTS</text>
  <text class="sub" x="506" y="205">qwen3-tts-flash → voice</text>

  <rect class="model" x="490" y="224" width="190" height="52" rx="10"/>
  <text class="gold" x="506" y="246">Qwen-Max</text>
  <text class="sub" x="506" y="265">subtitle translation</text>

  <line class="flow" x1="410" y1="145" x2="468" y2="150"/>

  <rect class="box" x="740" y="105" width="186" height="80" rx="12"/>
  <text class="lbl" x="758" y="132">ffmpeg</text>
  <text class="sub" x="758" y="152">9:16 crop · burn subs</text>
  <text class="sub" x="758" y="169">mux voice · concat</text>

  <line class="flow" x1="700" y1="180" x2="738" y2="150"/>

  <rect class="model" x="740" y="230" width="186" height="66" rx="12" stroke="#e8b04b"/>
  <text class="gold" x="758" y="258">▶ episode.mp4</text>
  <text class="sub" x="758" y="278">vertical · subtitled</text>
  <line class="flow" x1="833" y1="185" x2="833" y2="228"/>

  <rect x="34" y="360" width="892" height="70" rx="14" fill="#14141b" stroke="#2b2b38" stroke-width="1.5"/>
  <text class="lbl" x="54" y="390">Showrunner Agent</text>
  <text class="sub" x="54" y="410">pipeline.py — plans the episode, drives every stage, emits live events</text>
  <text class="gold" x="640" y="390">FastAPI · SSE</text>
  <text class="sub" x="640" y="410">live production dashboard (server.py)</text>

  <line class="flow" x1="120" y1="360" x2="120" y2="188" stroke-dasharray="4 4"/>
  <line class="flow" x1="833" y1="296" x2="833" y2="360" stroke-dasharray="4 4"/>

  <text class="cap" x="34" y="470">Chat: /compatible-mode/v1 · AIGC: /api/v1/services/aigc/{video-generation, multimodal-generation, text2image}</text>
  <text class="cap" x="34" y="490">Card-free Qwen Cloud free tier · 1M tokens/model</text>
</svg>
